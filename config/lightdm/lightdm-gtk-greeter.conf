# ==============================================================================
# LightDM GTK Greeter - Tema Catppuccin Mocha (Sapphire Accent)
# Coherente con: Hyprland, Waybar, SwayNC y GTK-3.0
# Ubicación destino: /etc/lightdm/lightdm-gtk-greeter.conf
# ==============================================================================

[greeter]
# Tema de ventanas e interfaz GTK (Catppuccin Mocha Sapphire instalado en /usr/share/themes)
theme-name = catppuccin-mocha-sapphire-standard+default

# Iconos y Cursor acordes al sistema
# Nota: LightDM corre bajo el usuario 'lightdm', por lo que los recursos deben estar en /usr/share
icon-theme-name = Tela-circle-dark
cursor-theme-name = catppuccin-mocha-sapphire-cursors
cursor-theme-size = 24

# Tipografía del sistema
font-name = Inter 10
xft-antialias = true
xft-dpi = 96
xft-hintstyle = hintslight
xft-rgba = rgb

# Fondo de pantalla
# Coloca tu fondo en una ruta accesible para el usuario lightdm (ej: /usr/share/backgrounds/ o /etc/lightdm/)
# Si no hay imagen disponible, usa el color base de Catppuccin Mocha (#1e1e2e)
background = /usr/share/backgrounds/lightdm-wallpaper.jpg
user-background = false
transition-duration = 400
transition-type = ease-in-out

# Ventana de inicio de sesión (Centrada, limpia y moderna)
position = 50%,center 50%,center
default-user-image = #avatar-default
hide-user-image = false
round-user-image = true
highlight-logged-user = true

# Panel superior minimalista
panel-position = top
clock-format = %A, %d de %B  •  %H:%M
indicators = ~host;~spacer;~clock;~spacer;~layout;~session;~a11y;~power

# Comportamiento y Ahorro de pantalla
screensaver-timeout = 60
