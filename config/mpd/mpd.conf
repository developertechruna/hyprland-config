# =====================================================================
# Configuración de MPD (Music Player Daemon) - Local con PipeWire
# =====================================================================
# Ubicación destino: ~/.config/mpd/mpd.conf

# Directorios de música y base de datos
music_directory                  "~/Music"
playlist_directory               "~/.config/mpd/playlists"
db_file                          "~/.config/mpd/database"
log_file                         "syslog"
state_file                       "~/.config/mpd/state"
sticker_file                     "~/.config/mpd/sticker.sql"

# Red y conexiones locales
bind_to_address                  "127.0.0.1"
port                             "6600"
restore_paused                   "yes"
auto_update                      "yes"
follow_outside_symlinks          "yes"
follow_inside_symlinks           "yes"

# Salida de audio nativa a PipeWire
audio_output {
    type                         "pipewire"
    name                         "PipeWire Sound Server"
}
