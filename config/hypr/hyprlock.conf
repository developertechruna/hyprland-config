# Configuración de Bloqueo de Pantalla (Hyprlock) con estilo Catppuccin Mocha
# Ubicación destino original: ~/.config/hypr/hyprlock.conf

# Paleta de colores Catppuccin Mocha
$base = rgb(1e1e2e)
$surface0 = rgb(313244)
$text = rgb(cdd6f4)
$mauve = rgb(cba6f7)
$red = rgb(f38ba8)
$yellow = rgb(f9e2af)

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    path = screenshot  # Captura de pantalla del escritorio difuminada
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# HORA (Hora y Minutos en formato vertical grande)
# Horas
label {
    monitor =
    text = cmd[update:1000] echo "$(/usr/bin/date +"%H")"
    color = $mauve
    font_size = 120
    font_family = SauceCodePro Nerd Font
    position = 0, -50
    halign = center
    valign = top
}

# Minutos
label {
    monitor =
    text = cmd[update:1000] echo "$(/usr/bin/date +"%M")"
    color = $text
    font_size = 120
    font_family = SauceCodePro Nerd Font
    position = 0, -210
    halign = center
    valign = top
}

# FECHA
label {
    monitor =
    text = cmd[update:1000] echo "$(/usr/bin/date +"%A, %d de %B")"
    color = $text
    font_size = 20
    font_family = SauceCodePro Nerd Font
    position = 0, -380
    halign = center
    valign = top
}

# INPUT FIELD (Contraseña)
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.26
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    outer_color = $mauve
    inner_color = $surface0
    font_color = $text
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <i>Introduce la contraseña...</i>
    hide_input = false
    rounding = -1
    check_color = $yellow
    fail_color = $red
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300
    capslock_color = $yellow
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false

    position = 0, -100
    halign = center
    valign = center
}
