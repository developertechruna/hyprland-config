# Configuración del Administrador de Inactividad (Hypridle)
# Ubicación destino original: ~/.config/hypr/hypridle.conf

general {
    lock_cmd = pidof hyprlock || hyprlock          # Comando dbus para bloquear sesión
    before_sleep_cmd = loginctl lock-session       # Bloquear pantalla antes de suspender
    after_sleep_cmd = hyprctl dispatch dpms on     # Evita tener que presionar teclas extra para encender pantalla
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# 1. Atenuar la pantalla tras 5 minutos de inactividad
listener {
    timeout = 300                                  # 300 segundos = 5 minutos
    on-timeout = brightnessctl -s set 10           # Guarda brillo actual y lo baja al mínimo (10)
    on-resume = brightnessctl -r                   # Restaura el brillo guardado
}

# 2. Apagar retroiluminación del teclado tras 5 minutos de inactividad (opcional)
listener {
    timeout = 300                                  # 300 segundos = 5 minutos
    on-timeout = brightnessctl -sd rgb:kbd_backlight set 0 # Apaga teclado (si aplica)
    on-resume = brightnessctl -rd rgb:kbd_backlight        # Enciende teclado
}

# 3. Bloquear la pantalla automáticamente tras 10 minutos de inactividad
listener {
    timeout = 600                                  # 600 segundos = 10 minutos
    on-timeout = loginctl lock-session             # Dispara hyprlock a través de systemd/loginctl
}

# 4. Apagar la pantalla (DPMS off) tras 15 minutos de inactividad
# Apaga la señal de video para proteger pantallas y ahorrar energía,
# pero la CPU, red y agentes de IA se mantienen 100% activos y funcionando.
listener {
    timeout = 900                                  # 900 segundos = 15 minutos
    on-timeout = hyprctl dispatch dpms off         # Apaga señal de video de los monitores
    on-resume = hyprctl dispatch dpms on           # Vuelve a encender monitores al mover mouse o presionar teclas
}

# 5. Suspender / Hibernar la computadora tras inactividad: DESACTIVADO PERMANENTEMENTE
# NOTA: Desactivado para que NUNCA se corten los agentes de IA, procesos en segundo plano,
# descargas ni conexiones de red.
#
