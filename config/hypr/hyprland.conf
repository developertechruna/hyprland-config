# Configuración de Hyprland para Programador
# Ubicación original destino: ~/.config/hypr/hyprland.conf

# ==========================================
# 🖥️ Monitores
# ==========================================
# Detecta automáticamente la resolución y tasa de refresco recomendadas
monitor=,preferred,auto,auto

# ==========================================
# 🚀 Autostart (Aplicaciones al iniciar)
# ==========================================
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP # Importar variables de Wayland para compartir pantalla/portales
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP PATH
exec-once = waybar                                            # Barra superior
exec-once = awww-daemon                                       # Fondo de pantalla animado
exec-once = bash ~/.config/hypr/wallpaper_loop.sh             # Rotación automática de fondos de pantalla cada 5 min
exec-once = systemctl --user restart xdg-desktop-portal.service
exec-once = mako                                              # Gestor de notificaciones
exec-once = nm-applet --indicator                            # Applet de red en el tray
exec-once = blueman-applet                                    # Applet de Bluetooth en el tray
exec-once = hypridle                                          # Gestor de inactividad (bloqueo/salvapantallas)
# Historial del portapapeles (wl-clipboard + cliphist)
exec-once = wl-paste --type text --watch cliphist store       
exec-once = wl-paste --type image --watch cliphist store
# Agente de autenticación de polkit (para diálogos de root/sudo en interfaz)
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
# Script para arrastrar ventanas a los bordes y cambiar de espacio de trabajo
exec-once = ~/.config/hypr/drag_edge.py

# Dock gráfico inferior/lateral (nwg-dock-hyprland)
exec-once = python3 ~/.config/hypr/launch_docks.py

# Sincronización de temas y fuentes GTK/GSettings a tamaño 9
exec-once = bash ~/.config/hypr/set_gtk.sh

# Demonio de Flameshot en segundo plano para respuesta inmediata al capturar
exec-once = flameshot &

# Monitor de batería y corriente (notificaciones al enchufar / desenchufar)
exec-once = bash ~/.config/hypr/power_notify.sh
# ==========================================
# ⚙️ Variables de Entorno (Wayland Compatibility)
# ==========================================
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = CLUTTER_BACKEND,wayland
env = SDL_VIDEODRIVER,wayland
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# Java AWT / Swing compatibilidad (Crucial para IDEs Java como NetBeans/etc)
env = _JAVA_AWT_WM_NONREPARENTING,1

# ==========================================
# ⚡ Opciones del Ecosistema y Miscelánea (Hyprland 0.56)
# ==========================================
ecosystem {
    no_update_news = true
    no_donation_nag = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

cursor {
    no_hardware_cursors = 2
}


# ==========================================
# ⌨️ Dispositivos de Entrada
# ==========================================
input {
    # Layouts de teclado (US y Latam) - Cambiados mediante script bind en $mainMod + Espacio
    kb_layout = us,latam
    
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
    sensitivity = 0 # -1.0 - 1.0, 0 significa sin cambios
}

# ==========================================
# 🎨 Apariencia Visual (Bordes Degradados, Glassmorphism y Catppuccin)
# ==========================================
general {
    gaps_in = 3               # Espaciado interno entre ventanas
    gaps_out = 1, 5, 5, 5     # 1px superior (mínimo espacio con Waybar), 5px en lados y abajo
    border_size = 2           # Bordes nítidos definidos
    
    # Gradiente Lavanda a Cyan brillante (como en el diseño objetivo)
    col.active_border = rgb(cba6f7) rgb(89dceb) 45deg
    col.inactive_border = rgba(313244aa) # Gris oscuro con transparencia para ventanas inactivas

    layout = dwindle
}

decoration {
    rounding = 12             # Esquinas redondeadas y fluidas (Diseño objetivo)
    active_opacity = 0.98     # Casi opaco para máximo contraste y legibilidad
    inactive_opacity = 0.90   # Suave atenuación para ventanas secundarias

    blur {
        enabled = true
        size = 6
        passes = 2            # Dual-kawase blur para efecto glassmorphism premium
        new_optimizations = true
        ignore_opacity = true
        xray = false
    }

    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(11111b88)
    }
}

# Configuración de Animaciones (Suaves y ágiles)
animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 4, myBezier
    animation = windowsOut, 1, 4, default, popin 80%
    animation = border, 1, 5, default
    animation = borderangle, 1, 4, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 3, default
}

# Configuración de Disposición
dwindle {
    preserve_split = true
}

# ==========================================
# 🪟 Reglas de Ventanas (Fácil Manejo para IDEs)
# ==========================================
# Reglas de Eclipse: Forzar a flotar y centrar ventanas secundarias, diálogos y asistentes
windowrule = match:class ^([Ee]clipse)$, match:title ^(.*)(Dialog|Properties|Preferences|Wizard|Settings|New|Open|Save|Select|Progress|Confirm|Find|Search|Replace|Refactor|Rename|Git|Commit|Push|Pull|Merge|Update|Error|Warning|Information).*$, float true
windowrule = match:class ^([Ee]clipse)$, match:title ^(.*)(Dialog|Properties|Preferences|Wizard|Settings|New|Open|Save|Select|Progress|Confirm|Find|Search|Replace|Refactor|Rename|Git|Commit|Push|Pull|Merge|Update|Error|Warning|Information).*$, center true
windowrule = match:class ^([Ee]clipse)$, match:title ^(Select).*$, float true
windowrule = match:class ^([Ee]clipse)$, match:title ^(Select).*$, center true
windowrule = match:class ^([Ee]clipse)$, match:title ^(Progress).*$, float true
windowrule = match:class ^([Ee]clipse)$, match:title ^(Progress).*$, center true
windowrule = match:class ^([Ee]clipse)$, match:title ^(Confirm).*$, float true
windowrule = match:class ^([Ee]clipse)$, match:title ^(Confirm).*$, center true

# Reglas de Antigravity IDE (VS Code / Electron)
windowrule = match:class ^(code-url-handler)$, float true

# Reglas de Thunar: Forzar popups, diálogos de progreso, propiedades y confirmación a flotar y centrarse
windowrule = match:class ^([Tt]hunar)$, match:title ^(.*)(Dialog|Properties|Propiedades|Preferences|Preferencias|Progress|Progreso|Conflict|Conflicto|Confirm|Confirmar|Create|Crear|Rename|Renombrar|Choose|Select|Seleccionar|Open|Abrir|Save|Guardar|Extract|Extraer|Error|Warning|Advertencia|Copying|Moving|Deleting|Eliminar).*$, float true
windowrule = match:class ^([Tt]hunar)$, match:title ^(.*)(Dialog|Properties|Propiedades|Preferences|Preferencias|Progress|Progreso|Conflict|Conflicto|Confirm|Confirmar|Create|Crear|Rename|Renombrar|Choose|Select|Seleccionar|Open|Abrir|Save|Guardar|Extract|Extraer|Error|Warning|Advertencia|Copying|Moving|Deleting|Eliminar).*$, center true

# Otras ventanas que siempre deben flotar (sencillez de uso)
windowrule = match:class ^(org.pulseaudio.pavucontrol)$, float true
windowrule = match:class ^(nm-connection-editor)$, float true
windowrule = match:class ^(blueman-manager)$, float true
windowrule = match:class ^(blueman-adapters)$, float true

# Reglas de Picture-in-Picture (PiP) para Navegadores (Firefox, Chrome, Brave, Zen, etc.)
windowrule = match:title ^(.*)(Picture-in-Picture|Picture-in-picture|Picture in picture|Imagen en imagen)(.*)$, float true
windowrule = match:title ^(.*)(Picture-in-Picture|Picture-in-picture|Picture in picture|Imagen en imagen)(.*)$, pin true
windowrule = match:title ^(.*)(Picture-in-Picture|Picture-in-picture|Picture in picture|Imagen en imagen)(.*)$, size 450 255


# Reglas de LibreOffice / OpenOffice para ventanas de diálogo (Abrir/Guardar/etc)
windowrule = match:class ^(soffice|libreoffice.*)$, match:title ^(Open|Abrir|Save|Guardar|Save As|Guardar como|Confirm|Properties|Choose|Select|Select a File|Seleccionar un archivo)$, float true
windowrule = match:class ^(soffice|libreoffice.*)$, match:title ^(Open|Abrir|Save|Guardar|Save As|Guardar como|Confirm|Properties|Choose|Select|Select a File|Seleccionar un archivo)$, center true

windowrule = match:class ^(xfce4-appfinder)$, float true
windowrule = match:class ^(xfce4-appfinder)$, center true
windowrule = match:class ^(xfce4-appfinder)$, size 800 500
windowrule = match:title ^(Application Finder)$, float true
windowrule = match:title ^(Application Finder)$, center true
windowrule = match:title ^(Application Finder)$, size 800 500

# Opacidad sutil y desenfoque para terminales (Kitty / XFCE4 Terminal)
windowrule = match:class ^(xfce4-terminal)$, opacity 0.94 0.88
windowrule = match:class ^(kitty)$, opacity 0.94 0.88

# Efecto Blur para la barra superior (Waybar) y el lanzador (Rofi)
layerrule = match:namespace ^(waybar)$, blur true
layerrule = match:namespace ^(rofi)$, blur true
layerrule = match:namespace ^(rofi)$, ignore_alpha 0.5

# Reglas de Flameshot (Captura centrada tanto vertical como horizontalmente en la pantalla activa)
windowrule = match:class ^([Ff]lameshot)$, float true
windowrule = match:class ^([Ff]lameshot)$, center true
windowrule = match:class ^([Ff]lameshot)$, pin true
windowrule = match:class ^([Ff]lameshot)$, no_anim true
windowrule = match:class ^([Ff]lameshot)$, stay_focused true

# ==========================================
# ⌨️ Atajos de Teclado (Keyboard Shortcuts)
# ==========================================
$mainMod = SUPER

# Cambio de distribución de teclado y mayúsculas
bind = $mainMod, SPACE, exec, python3 ~/.config/hypr/switch_layout.py # Cambiar layout de teclado
bind = , Caps_Lock, exec, pkill -RTMIN+1 waybar                        # Actualizar indicador de mayúsculas en Waybar

# Ejecución de Aplicaciones Clave
bind = $mainMod, RETURN, exec, which kitty >/dev/null 2>&1 && kitty || xfce4-terminal # Lanzar Terminal (Kitty o XFCE4)
bind = $mainMod, B, exec, firefox                            # Lanzar Navegador
bind = $mainMod, E, exec, thunar                            # Lanzar Gestor de archivos (Thunar)
bind = $mainMod, D, exec, rofi -show drun                   # Lanzar Buscador Estilizado Rofi (Spotlight)
bind = $mainMod SHIFT, D, exec, nwg-drawer                  # Lanzar Menú Visual por Categorías (nwg-drawer)
bind = $mainMod, M, exec, nwg-drawer                         # Alternativa Menú Visual (nwg-drawer)
bind = $mainMod, A, exec, python3 ~/.config/hypr/toggle_dock.py # Mostrar/Ocultar dock en monitor enfocado
bind = $mainMod, Escape, exec, wlogout                       # Lanzar Menú de Salida/Apagado Gráfico (wlogout)
bind = $mainMod, P, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy # Portapapeles

# Control de Ventanas y Sistema
bind = $mainMod, Q, killactive,                              # Cerrar ventana activa
bind = $mainMod SHIFT, K, exec, hyprctl kill                     # Matar ventana seleccionada (xkill)
bind = $mainMod SHIFT, E, exit,                              # Salir de Hyprland
bind = $mainMod, V, togglefloating,                          # Ventana activa a flotante/tiled
bind = ALT, Tab, exec, rofi -show window                     # Listar y cambiar de ventana activa (Alt + Tab)
bind = $mainMod, F, fullscreen,                              # Pantalla completa
bind = $mainMod, S, exec, XDG_CURRENT_DESKTOP=sway flameshot gui             # Capturar pantalla con Flameshot (compatibilidad Wayland/wlroots)
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy -t image/png   # Capturar directamente al portapapeles (sin editar)
bind = $mainMod SHIFT, L, exec, hyprlock                       # Bloquear pantalla manualmente


# Mover foco entre ventanas (Estilo Vim: H, J, K, L)
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Cambiar a Espacios de Trabajo (Workspaces 1-10)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Mover ventana activa a Espacio de Trabajo
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Moverse entre espacios de trabajo (workspaces) con SUPER + Flechas Izquierda / Derecha
bind = $mainMod, left, workspace, r-1
bind = $mainMod, right, workspace, r+1

# Mover ventana activa al espacio de trabajo anterior / siguiente con SUPER + SHIFT + Flechas Izquierda / Derecha
bind = $mainMod SHIFT, left, movetoworkspace, r-1
bind = $mainMod SHIFT, right, movetoworkspace, r+1

# Mover ventana activa a la parte inferior de la pantalla con SUPER + SHIFT + Flecha Abajo
bind = $mainMod SHIFT, down, movewindow, d

# Mover/Redimensionar ventanas con mouse (Super + Click Izquierdo / Derecho)
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Control de volumen y brillo (Teclas multimedia)
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, bash ~/.config/hypr/toggle_mic.sh
bind = $mainMod SHIFT, M, exec, bash ~/.config/hypr/toggle_mic.sh
binde = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
