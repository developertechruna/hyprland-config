# Configuración de Hyprland para Programador
# Ubicación original destino: ~/.config/hypr/hyprland.conf

# ==========================================
# 🖥️ Monitores
# ==========================================
# Detecta automáticamente la resolución y tasa de refresco recomendadas
monitor=,preferred,auto,auto

# ==========================================
# 🚀 Autostart (Aplicaciones al iniciar)
# ==========================================
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP # Importar variables de Wayland para compartir pantalla/portales
exec-once = systemctl --user start hyprland-session.service   # Iniciar la sesión gráfica en systemd para portales y servicios
exec-once = waybar                                            # Barra superior
exec-once = swww-daemon                                       # Fondo de pantalla animado
exec-once = mako                                              # Gestor de notificaciones
exec-once = nm-applet --indicator                            # Applet de red en el tray
exec-once = blueman-applet                                    # Applet de Bluetooth en el tray
exec-once = hypridle                                          # Gestor de inactividad (bloqueo/salvapantallas)
# Historial del portapapeles (wl-clipboard + cliphist)
exec-once = wl-paste --type text --watch cliphist store       
exec-once = wl-paste --type image --watch cliphist store
# Agente de autenticación de polkit (para diálogos de root/sudo en interfaz)
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
# Script para arrastrar ventanas a los bordes y cambiar de espacio de trabajo
exec-once = ~/.config/hypr/drag_edge.py


# ==========================================
# ⚙️ Variables de Entorno (Wayland Compatibility)
# ==========================================
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = CLUTTER_BACKEND,wayland
env = SDL_VIDEODRIVER,wayland

# Java AWT / Swing compatibilidad (Crucial para IDEs Java como NetBeans/etc)
env = _JAVA_AWT_WM_NONREPARENTING,1

# ==========================================
# ⌨️ Dispositivos de Entrada
# ==========================================
input {
    # Layouts de teclado (US y Latam) - Cambiados mediante script bind en $mainMod + Espacio
    kb_layout = us,latam
    
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
    sensitivity = 0 # -1.0 - 1.0, 0 significa sin cambios
}

# ==========================================
# 🎨 Apariencia Visual (Bordes Finos y Catppuccin)
# ==========================================
general {
    gaps_in = 3               # Espaciado interno entre ventanas
    gaps_out = 5              # Espaciado externo con el borde de pantalla
    border_size = 1           # Bordes súper finos (Requerimiento)
    
    # Colores activos (Gradiente elegante en tonos morado/azul de Catppuccin)
    col.active_border = rgb(cba6f7) rgb(89b4fa) 45deg
    col.inactive_border = rgb(313244) # Gris oscuro para ventanas inactivas

    layout = dwindle
}

decoration {
    rounding = 4              # Esquinas sutilmente redondeadas

    blur {
        enabled = true
        size = 3
        passes = 1
        new_optimizations = true
    }

    shadow {
        enabled = false       # Desactivado para maximizar rendimiento y minimalismo
    }
}

# Configuración de Animaciones (Suaves y ágiles)
animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 4, myBezier
    animation = windowsOut, 1, 4, default, popin 80%
    animation = border, 1, 5, default
    animation = borderangle, 1, 4, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 3, default
}

# Configuración de Disposición
dwindle {
    preserve_split = true
}

# ==========================================
# 🪟 Reglas de Ventanas (Fácil Manejo para IDEs)
# ==========================================
# Reglas de Eclipse: Forzar a flotar ventanas secundarias, diálogos y asistentes
windowrule = match:class ^(Eclipse)$, match:title ^(.*)(Dialog|Properties|Preferences|Wizard|Settings|New|Open|Save).*$, float true
windowrule = match:class ^(Eclipse)$, match:title ^(Select).*$, float true
windowrule = match:class ^(Eclipse)$, match:title ^(Progress).*$, float true
windowrule = match:class ^(Eclipse)$, match:title ^(Confirm).*$, float true

# Reglas de Antigravity IDE (VS Code / Electron)
windowrule = match:class ^(code-url-handler)$, float true

# Reglas de Thunar: Forzar popups, diálogos de progreso, propiedades y confirmación a flotar y centrarse
windowrule = match:class ^([Tt]hunar)$, match:title ^(.*)(Dialog|Properties|Propiedades|Preferences|Preferencias|Progress|Progreso|Conflict|Conflicto|Confirm|Confirmar|Create|Crear|Rename|Renombrar|Choose|Select|Seleccionar|Open|Abrir|Save|Guardar|Extract|Extraer|Error|Warning|Advertencia|Copying|Moving|Deleting|Eliminar).*$, float true
windowrule = match:class ^([Tt]hunar)$, match:title ^(.*)(Dialog|Properties|Propiedades|Preferences|Preferencias|Progress|Progreso|Conflict|Conflicto|Confirm|Confirmar|Create|Crear|Rename|Renombrar|Choose|Select|Seleccionar|Open|Abrir|Save|Guardar|Extract|Extraer|Error|Warning|Advertencia|Copying|Moving|Deleting|Eliminar).*$, center true

# Otras ventanas que siempre deben flotar (sencillez de uso)
windowrule = match:class ^(org.pulseaudio.pavucontrol)$, float true
windowrule = match:class ^(nm-connection-editor)$, float true
windowrule = match:class ^(blueman-manager)$, float true
windowrule = match:class ^(blueman-adapters)$, float true

# Reglas de LibreOffice / OpenOffice para ventanas de diálogo (Abrir/Guardar/etc)
windowrule = match:class ^(soffice|libreoffice.*)$, match:title ^(Open|Abrir|Save|Guardar|Save As|Guardar como|Confirm|Properties|Choose|Select|Select a File|Seleccionar un archivo)$, float true
windowrule = match:class ^(soffice|libreoffice.*)$, match:title ^(Open|Abrir|Save|Guardar|Save As|Guardar como|Confirm|Properties|Choose|Select|Select a File|Seleccionar un archivo)$, center true

windowrule = match:class ^(xfce4-appfinder)$, float true
windowrule = match:class ^(xfce4-appfinder)$, center true
windowrule = match:class ^(xfce4-appfinder)$, size 800 500
windowrule = match:title ^(Application Finder)$, float true
windowrule = match:title ^(Application Finder)$, center true
windowrule = match:title ^(Application Finder)$, size 800 500

# Opacidad sutil para terminales
windowrule = match:class ^(xfce4-terminal)$, opacity 0.95 0.90

# ==========================================
# ⌨️ Atajos de Teclado (Keyboard Shortcuts)
# ==========================================
$mainMod = SUPER

# Cambio de distribución de teclado y mayúsculas
bind = $mainMod, SPACE, exec, python3 ~/.config/hypr/switch_layout.py # Cambiar layout de teclado
bind = , Caps_Lock, exec, pkill -RTMIN+1 waybar                        # Actualizar indicador de mayúsculas en Waybar

# Ejecución de Aplicaciones Clave
bind = $mainMod, RETURN, exec, xfce4-terminal                # Lanzar Xfce4 Terminal (Letra tamaño 9)
bind = $mainMod, B, exec, firefox                            # Lanzar Navegador
bind = $mainMod, E, exec, thunar                            # Lanzar Gestor de archivos (Thunar)
bind = $mainMod, D, exec, xfce4-appfinder                     # Lanzar buscador de aplicaciones (xfce4-appfinder)
bind = $mainMod SHIFT, D, exec, rofi -show drun               # Lanzar buscador completo de aplicaciones (Rofi)
bind = $mainMod, M, exec, nwg-drawer                         # Lanzar Menú Visual por Categorías (nwg-drawer)
bind = $mainMod, Escape, exec, wlogout                       # Lanzar Menú de Salida/Apagado Gráfico (wlogout)
bind = $mainMod, P, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy # Portapapeles

# Control de Ventanas y Sistema
bind = $mainMod, Q, killactive,                              # Cerrar ventana activa
bind = $mainMod SHIFT, K, exec, hyprctl kill                     # Matar ventana seleccionada (xkill)
bind = $mainMod SHIFT, E, exit,                              # Salir de Hyprland
bind = $mainMod, V, togglefloating,                          # Ventana activa a flotante/tiled
bind = ALT, Tab, exec, rofi -show window                     # Listar y cambiar de ventana activa (Alt + Tab)
bind = $mainMod, F, fullscreen,                              # Pantalla completa
bind = $mainMod, S, exec, grim -g "$(slurp)" - | swappy -f -                 # Capturar y editar con Swappy (copia/guarda y sale)
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy -t image/png   # Capturar directamente al portapapeles (sin editar)
bind = $mainMod SHIFT, L, exec, hyprlock                       # Bloquear pantalla manualmente


# Mover foco entre ventanas (Estilo Vim: H, J, K, L)
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Cambiar a Espacios de Trabajo (Workspaces 1-10)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Mover ventana activa a Espacio de Trabajo
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Moverse entre espacios de trabajo (workspaces) con SUPER + Flechas Izquierda / Derecha
bind = $mainMod, left, workspace, r-1
bind = $mainMod, right, workspace, r+1

# Mover ventana activa al espacio de trabajo anterior / siguiente con SUPER + SHIFT + Flechas Izquierda / Derecha
bind = $mainMod SHIFT, left, movetoworkspace, r-1
bind = $mainMod SHIFT, right, movetoworkspace, r+1

# Mover ventana activa a la parte inferior de la pantalla con SUPER + SHIFT + Flecha Abajo
bind = $mainMod SHIFT, down, movewindow, d

# Mover/Redimensionar ventanas con mouse (Super + Click Izquierdo / Derecho)
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Control de volumen y brillo (Teclas multimedia)
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, bash ~/.config/hypr/toggle_mic.sh
bind = $mainMod SHIFT, M, exec, bash ~/.config/hypr/toggle_mic.sh
binde = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
