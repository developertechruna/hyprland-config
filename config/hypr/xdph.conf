# Configuración de xdg-desktop-portal-hyprland (XDPH)
# Ubicación destino: ~/.config/hypr/xdph.conf
# Referencia: https://wiki.hypr.land/Hypr-Ecosystem/xdg-desktop-portal-hyprland/

screencopy {
    # Tasa máxima de refresco para captura de pantalla / screencast (Teams, Meet, OBS)
    max_fps = 60

    # Marcar automáticamente la casilla de permitir token de restauración
    allow_token_by_default = true

    # Modo de cursor para clientes que no especifican uno (como Teams, WebRTC, Chromium, Electron):
    # 0 = Oculto por defecto del protocolo
    # 1 = Oculto siempre
    # 2 = Incrustado (Embedded) -> Dibuja/quema el cursor directamente en el stream de video capturado
    cursor_mode = 2
}
